version: '3.8'

services:
  # PostgreSQL with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: coursecompass_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coursecompass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePass123!}
      POSTGRES_DB: ${POSTGRES_DB:-coursecompass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coursecompass} -d ${POSTGRES_DB:-coursecompass}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for background jobs, caching, and distributed rate limiting
  redis:
    image: redis:7-alpine
    container_name: coursecompass_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecurePass123!}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSecurePass123!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for private S3-compatible object storage
  storage:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: coursecompass_storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-MinioSecureSecret123!}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # FastAPI Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: coursecompass_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-coursecompass}:${POSTGRES_PASSWORD:-ChangeMeSecurePass123!}@db:5432/${POSTGRES_DB:-coursecompass}
      SECRET_KEY: ${SECRET_KEY:-ProductionJwtSecretMustBeAtLeast32CharsLong!}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-ProductionPepperSecretKeyMustBeSet!}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://storage:9000
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-coursecompass-materials}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-MinioSecureSecret123!}
      S3_REGION: ${S3_REGION:-us-east-1}
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisSecurePass123!}@redis:6379/0
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "https://app.coursecompass.edu"]'
    ports:
      - "8000:8000"

  # Asynchronous Ingestion & Graph Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: coursecompass_worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    command: python -m app.workers.ingestion_worker
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-coursecompass}:${POSTGRES_PASSWORD:-ChangeMeSecurePass123!}@db:5432/${POSTGRES_DB:-coursecompass}
      SECRET_KEY: ${SECRET_KEY:-ProductionJwtSecretMustBeAtLeast32CharsLong!}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://storage:9000
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-coursecompass-materials}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-MinioSecureSecret123!}
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisSecurePass123!}@redis:6379/0

  # React Frontend (NGINX SPA + Reverse Proxy)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: coursecompass_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:

